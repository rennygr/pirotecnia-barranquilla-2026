<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #0c0f14;
      --panel: #151a22;
      --panel-2: #1c232e;
      --text: #f3f5f8;
      --muted: #9aa5b4;
      --accent: #ff5a1f;
      --accent-2: #ffb703;
      --border: #2a3342;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 92px;
    }
    header {
      background: linear-gradient(135deg, #1a1210 0%, #121722 100%);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    h1 { font-size: 1.35rem; font-weight: 800; }
    h1 span { color: var(--accent-2); }
    .sub { font-size: 0.85rem; color: var(--muted); }
    .controls {
      max-width: 1240px;
      margin: 16px auto 0;
      padding: 0 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .search-input {
      flex: 1 1 260px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .cats { display: flex; flex-wrap: wrap; gap: 8px; }
    .cat-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .cat-btn.active, .cat-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .grid {
      max-width: 1240px;
      margin: 18px auto 0;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .img-wrap {
      aspect-ratio: 4 / 3;
      background: #10141b;
      position: relative;
      overflow: hidden;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .code-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(12, 15, 20, 0.88);
      border: 1px solid var(--border);
      color: var(--accent-2);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .cat-label { font-size: 0.72rem; text-transform: uppercase; color: var(--accent-2); font-weight: 700; }
    .title { font-size: 0.98rem; font-weight: 700; }
    .pres { font-size: 0.82rem; color: var(--muted); }
    .price { font-size: 1.12rem; font-weight: 800; color: var(--ok); margin-top: auto; padding-top: 4px; }
    .card-actions {
      padding: 0 14px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .qty-box { display: flex; align-items: center; gap: 6px; }
    .qty-btn {
      width: 30px; height: 30px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }
    .qty-val { min-width: 24px; text-align: center; font-weight: 700; }
    .add-btn {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .cart-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--panel-2);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      z-index: 30;
    }
    .cart-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .wa-btn {
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .sec-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 560px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
      gap: 8px;
    }
    .field { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 0.82rem; color: var(--muted); }
    .field input, .field select {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
    }
  </style>
</head>

      </div>
      <div class="sub" id="statsText">60 referencias disponibles</div>
    </div>
  </header>

  <div class="controls">

    </div>
  </div>

  <div class="modal-backdrop" id="cartModal">

      </div>
      <div class="field">

      </div>
      <div class="field">

      </div>
      <div style="margin-top:16px; display:flex; justify-content:space-between; align-items:center;">

        <button class="wa-btn" id="modalSendBtn">Pedir por WhatsApp</button>

    </div>

  },
  {
    "codigo": "COMBO-03",
    "categoria": "Combos Promocionales 2026",
    "nombre": "Combo Luces & Color",
    "presentacion": "Varas, fuentes y bengalas",
    "costo_base": 68000,
    "precio_venta": 96000
  },
  {
    "codigo": "COMBO-04",
    "categoria": "Combos Promocionales 2026",
    "nombre": "Combo Estallido Barranquilla",
    "presentacion": "Golpes, martillos y metralletas",
    "costo_base": 75000,
    "precio_venta": 106000
  },
  {
    "codigo": "COMBO-05",
    "categoria": "Combos Promocionales 2026",
    "nombre": "Combo Fiesta Soledad",
    "presentacion": "Tortas, volcanes y varas",
    "costo_base": 130000,
    "precio_venta": 185000
  },
  {
    "codigo": "COMBO-06",
    "categoria": "Combos Promocionales 2026",
    "nombre": "Combo Celebración Premium",
    "presentacion": "Selección aérea y luces",
    "costo_base": 195000,
    "precio_venta": 275000
  },
  {
    "codigo": "COMBO-07",
    "categoria": "Combos Promocionales 2026",
    "nombre": "Combo Evento / Reunión",
    "presentacion": "Surtido alto rendimiento",
    "costo_base": 260000,
    "precio_venta": 365000
  },
  {
    "codigo": "COMBO-08",
    "categoria": "Combos Promocionales 2026",
    "nombre": "Combo Gran Show Fin de Año",
    "presentacion": "Paquete completo gran formato",
    "costo_base": 420000,
    "precio_venta": 590000
  }
];

    const state = {
      category: "Todos",
      search: "",
      quantities: {},
      cart: {}
    };

    const fmtCOP = (n) => "$" + Number(n || 0).toLocaleString("es-CO");

    function fallbackSvg(code, name) {
      const safeCode = String(code || "").replace(/[<>&"]/g, "");
      const safeName = String(name || "").replace(/[<>&"]/g, "");
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><rect width="800" height="600" fill="#141923"/><rect x="24" y="24" width="752" height="552" rx="18" fill="none" stroke="#2c3648" stroke-width="3"/><text x="400" y="255" text-anchor="middle" fill="#ffb703" font-family="Arial,sans-serif" font-size="42" font-weight="bold">${safeCode}</text><text x="400" y="315" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="24">${safeName}</text><text x="400" y="360" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="18">Pirotecnia Barranquilla 2026</text></svg>`;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function initCategories() {
      const cats = ["Todos", ...new Set(CATALOGO_2026.map(i => i.categoria))];
      const container = document.getElementById("catButtons");
      container.innerHTML = cats.map(c =>
        `<button class="cat-btn ${c === state.category ? "active" : ""}" data-cat="${c}">${c}</button>`
      ).join("");
      container.querySelectorAll(".cat-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.category = btn.dataset.cat;
          initCategories();
          renderGrid();
        });
      });
    }

    function renderGrid() {
      const q = state.search.trim().toLowerCase();
      const filtered = CATALOGO_2026.filter(item => {
        const matchCat = state.category === "Todos" || item.categoria === state.category;
        const matchQ = !q ||
          item.codigo.toLowerCase().includes(q) ||
          item.nombre.toLowerCase().includes(q) ||
          item.presentacion.toLowerCase().includes(q) ||
          item.categoria.toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      document.getElementById("statsText").textContent =
        `Mostrando ${filtered.length} de ${CATALOGO_2026.length} referencias`;

      const grid = document.getElementById("catalogGrid");
      grid.innerHTML = filtered.map(item => {
        const qty = state.quantities[item.codigo] || 1;
        const safeName = item.nombre.replace(/'/g, "");
        return `
          <article class="card">
            <div class="img-wrap">
              <span class="code-badge">${item.codigo}</span>
              <img src="img/${item.codigo}.jpg" alt="${item.nombre}"
                   onerror="this.onerror=null; this.src=fallbackSvg('${item.codigo}','${safeName}');" />
            </div>
            <div class="card-body">
              <div class="cat-label">${item.categoria}</div>
              <div class="title">${item.nombre}</div>
              <div class="pres">${item.presentacion}</div>
              <div class="price">${fmtCOP(item.precio_venta)}</div>
            </div>
            <div class="card-actions">
              <div class="qty-box">
                <button class="qty-btn" onclick="changeQty('${item.codigo}', -1)">-</button>
                <span class="qty-val" id="q-${item.codigo}">${qty}</span>
                <button class="qty-btn" onclick="changeQty('${item.codigo}', 1)">+</button>
              </div>
              <button class="add-btn" onclick="addToCart('${item.codigo}')">Agregar</button>
            </div>
          </article>
        `;
      }).join("");
    }

    function changeQty(code, delta) {
      const cur = state.quantities[code] || 1;
      const next = Math.max(1, cur + delta);
      state.quantities[code] = next;
      const el = document.getElementById("q-" + code);
      if (el) el.textContent = next;
    }

    function addToCart(code) {
      const item = CATALOGO_2026.find(x => x.codigo === code);
      if (!item) return;
      const addQty = state.quantities[code] || 1;
      state.cart[code] = (state.cart[code] || 0) + addQty;
      state.quantities[code] = 1;
      const el = document.getElementById("q-" + code);
      if (el) el.textContent = 1;
      updateCartBar();
    }

    function updateCartBar() {
      let count = 0;
      let total = 0;
      for (const [code, qty] of Object.entries(state.cart)) {
        const item = CATALOGO_2026.find(x => x.codigo === code);
        if (item && qty > 0) {
          count += qty;
          total += item.precio_venta * qty;
        }
      }
      document.getElementById("cartSummary").textContent = `${count} unidad(es)`;
      document.getElementById("cartTotal").textContent = fmtCOP(total);
      document.getElementById("modalTotal").textContent = fmtCOP(total);
    }

    function renderCartModal() {
      const list = document.getElementById("cartItemsList");
      const entries = Object.entries(state.cart).filter(([, q]) => q > 0);
      if (!entries.length) {
        list.innerHTML = `<p style="color:var(--muted);">Tu pedido está vacío.</p>`;
        return;
      }
      list.innerHTML = entries.map(([code, qty]) => {
        const item = CATALOGO_2026.find(x => x.codigo === code);
        const sub = item.precio_venta * qty;
        return `
          <div class="cart-item">
            <div>
              <strong>${item.codigo}</strong> · ${item.nombre}<br/>
              <small style="color:var(--muted);">${qty} x ${fmtCOP(item.precio_venta)}</small>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <strong>${fmtCOP(sub)}</strong>
              <button class="qty-btn" onclick="removeItem('${code}')">✕</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function removeItem(code) {
      delete state.cart[code];
      updateCartBar();
      renderCartModal();
    }

    function sendWhatsApp() {
      const entries = Object.entries(state.cart).filter(([, q]) => q > 0);
      if (!entries.length) {
        alert("Agrega al menos un producto al pedido.");
        return;
      }
      const name = document.getElementById("clientName").value.trim() || "Cliente";
      const zone = document.getElementById("clientZone").value;
      const note = document.getElementById("clientNote").value.trim();

      let total = 0;
      const lines = [
        "*PEDIDO PIROTECNIA BARRANQUILLA 2026*",
        `Cliente: ${name}`,
        `Zona: ${zone}`,
        note ? `Nota: ${note}` : null,
        "--------------------------------"
      ].filter(Boolean);

      for (const [code, qty] of entries) {
        const item = CATALOGO_2026.find(x => x.codigo === code);
        const sub = item.precio_venta * qty;
        total += sub;
        lines.push(`• [${item.codigo}] ${item.nombre} (${item.presentacion}) x${qty} = ${fmtCOP(sub)}`);
      }
      lines.push("--------------------------------");
      lines.push(`*TOTAL ESTIMADO: ${fmtCOP(total)}*`);

      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(lines.join("\n"))}`;
      window.open(url, "_blank");
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      state.search = e.target.value;
      renderGrid();
    });
    document.getElementById("openCartBtn").addEventListener("click", () => {
      renderCartModal();
      document.getElementById("cartModal").classList.add("open");
    });
    document.getElementById("closeModalBtn").addEventListener("click", () => {
      document.getElementById("cartModal").classList.remove("open");
    });
    document.getElementById("sendWaBtn").addEventListener("click", sendWhatsApp);
    document.getElementById("modalSendBtn").addEventListener("click", sendWhatsApp);

    initCategories();
    renderGrid();
    updateCartBar();
  </script>
</body>
